name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check, test, and build XPI
        run: npm run check

      - name: Upload prototype XPI
        uses: actions/upload-artifact@v7
        with:
          name: zotero-pdf-sticky-notes-${{ github.sha }}
          path: dist/*.xpi
          if-no-files-found: error
